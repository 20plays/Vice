name: patch tray lifecycle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-tray-lifecycle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch tray lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("vice/tray_app.py")
          text = path.read_text()

          text = text.replace(
              "import socket\nimport threading\n",
              "import socket\nimport subprocess\nimport threading\n",
              1,
          )

          old = '''def _stop_command_server() -> None:
              global _command_server
              with _command_server_lock:
                  server = _command_server
                  _command_server = None
              if server is not None:
                  server.close()


          def _tray_icon(QIcon: Any) -> Any:
          '''
          new = '''def _stop_command_server() -> None:
              global _command_server
              with _command_server_lock:
                  server = _command_server
                  _command_server = None
              if server is not None:
                  server.close()


          def _stop_daemon_completely(timeout: float = 10.0) -> None:
              """Stop every Vice recorder owner and wait until it is actually gone."""
              # If the installer created a user service, systemd owns the daemon.
              # Stopping the unit first also suppresses Restart= while this explicit
              # quit is in progress. The IPC stop below remains a fallback for a
              # daemon that was launched directly or escaped the unit.
              if _app._systemd_unit_available():
                  try:
                      result = subprocess.run(
                          ["systemctl", "--user", "stop", "vice.service"],
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.PIPE,
                          text=True,
                          timeout=15,
                          check=False,
                      )
                      if result.returncode != 0:
                          _app.log.warning(
                              "systemctl stop vice.service failed (%s): %s",
                              result.returncode,
                              (result.stderr or "").strip()[:200],
                          )
                  except (OSError, subprocess.SubprocessError) as exc:
                      _app.log.warning("Could not stop Vice systemd service: %s", exc)

              _app._stop_daemon()
              _app._wait_for_daemon_exit(timeout=timeout)


          def _request_quit(win: Any) -> None:
              """Request a real application quit instead of a hide-to-tray close."""
              controller = getattr(win, "_vice_tray_controller", None)
              if controller is not None:
                  controller.quit_requested.emit()
                  return

              # Non-Qt fallback. This may block briefly, but it guarantees that an
              # explicit Quit does not leave the recorder/hotkey daemon behind.
              _stop_daemon_completely()
              try:
                  win.destroy()
              except Exception:
                  _app.log.debug("win.destroy() failed during quit", exc_info=True)


          def _tray_icon(QIcon: Any) -> Any:
          '''
          if old not in text:
              raise SystemExit("command-server insertion point not found")
          text = text.replace(old, new, 1)

          old = '''    class _TrayController(QtCore.QObject):
                  show_requested = QtCore.Signal()
                  hide_requested = QtCore.Signal()

                  def __init__(self) -> None:
                      super().__init__(native)
                      self.show_requested.connect(self.show_window)
                      self.hide_requested.connect(self.hide_window)

                  @QtCore.Slot()
                  def show_window(self) -> None:
                      native.showNormal()
                      native.show()
                      native.raise_()
                      native.activateWindow()
                      handle = native.windowHandle()
                      if handle is not None:
                          try:
                              handle.requestActivate()
                          except Exception:
                              pass

                  @QtCore.Slot()
                  def hide_window(self) -> None:
                      native.hide()

                  @QtCore.Slot()
                  def quit_vice(self) -> None:
                      _app._stop_daemon()
                      native.close()
          '''
          new = '''    class _TrayController(QtCore.QObject):
                  show_requested = QtCore.Signal()
                  hide_requested = QtCore.Signal()
                  quit_requested = QtCore.Signal()
                  quit_finished = QtCore.Signal()

                  def __init__(self) -> None:
                      super().__init__(native)
                      self._allow_close = False
                      self._quitting = False
                      self.show_requested.connect(self.show_window)
                      self.hide_requested.connect(self.hide_window)
                      self.quit_requested.connect(self.quit_vice)
                      self.quit_finished.connect(self._finish_quit)
                      native.installEventFilter(self)

                  def eventFilter(self, watched: Any, event: Any) -> bool:
                      # The window-manager X button is another way of saying
                      # "keep Vice running in the tray". Consume the native close
                      # event so pywebview cannot destroy the QMainWindow/tray.
                      if (
                          watched is native
                          and event.type() == QtCore.QEvent.Type.Close
                          and not self._allow_close
                      ):
                          event.ignore()
                          native.hide()
                          return True
                      return super().eventFilter(watched, event)

                  @QtCore.Slot()
                  def show_window(self) -> None:
                      native.showNormal()
                      native.show()
                      native.raise_()
                      native.activateWindow()
                      handle = native.windowHandle()
                      if handle is not None:
                          try:
                              handle.requestActivate()
                          except Exception:
                              pass

                  @QtCore.Slot()
                  def hide_window(self) -> None:
                      native.hide()

                  @QtCore.Slot()
                  def quit_vice(self) -> None:
                      if self._quitting:
                          return
                      self._quitting = True
                      threading.Thread(
                          target=self._shutdown_worker,
                          name="vice-tray-quit",
                          daemon=True,
                      ).start()

                  def _shutdown_worker(self) -> None:
                      try:
                          _stop_daemon_completely()
                      except Exception:
                          _app.log.exception("Could not fully stop Vice during tray quit")
                      finally:
                          self.quit_finished.emit()

                  @QtCore.Slot()
                  def _finish_quit(self) -> None:
                      # Only an explicit Quit gets permission to pass through the
                      # close-event filter. Hide the tray first so it disappears
                      # immediately when the native window exits.
                      self._allow_close = True
                      tray = getattr(native, "_vice_tray", None)
                      if tray is not None:
                          tray.hide()
                      native.close()
          '''
          if old not in text:
              raise SystemExit("tray controller block not found")
          text = text.replace(old, new, 1)

          old = '''        if api is not None and hasattr(api, "keep_running"):
                      # Vice's native "minimize" control used to destroy the window.
                      # Hiding it keeps this process (and therefore the tray icon) alive.
                      api.keep_running = lambda: _request_hide(win)
                  _start_command_server(win)
          '''
          new = '''        if api is not None and hasattr(api, "keep_running"):
                      # Vice's native "minimize" control used to destroy the window.
                      # Hiding it keeps this process (and therefore the tray icon) alive.
                      api.keep_running = lambda: _request_hide(win)
                  if api is not None and hasattr(api, "quit_app"):
                      # Route the in-app Quit control through the exact same verified
                      # shutdown path as the tray menu.
                      api.quit_app = lambda: _request_quit(win)
                  _start_command_server(win)
          '''
          if old not in text:
              raise SystemExit("webview API hook block not found")
          text = text.replace(old, new, 1)

          path.write_text(text)

          tests = Path("tests/test_tray_app.py")
          test_text = tests.read_text()
          marker = '''

          if __name__ == "__main__":
              unittest.main()
          '''
          addition = '''

          class TrayShutdownTests(unittest.TestCase):
              def test_shutdown_stops_systemd_owner_then_ipc_and_waits(self) -> None:
                  result = mock.Mock(returncode=0, stderr="")
                  with mock.patch.object(
                      tray_app._app, "_systemd_unit_available", return_value=True
                  ), mock.patch.object(
                      tray_app.subprocess, "run", return_value=result
                  ) as run, mock.patch.object(
                      tray_app._app, "_stop_daemon"
                  ) as stop, mock.patch.object(
                      tray_app._app, "_wait_for_daemon_exit", return_value=True
                  ) as wait:
                      tray_app._stop_daemon_completely(timeout=0.25)

                  run.assert_called_once()
                  self.assertEqual(
                      run.call_args.args[0],
                      ["systemctl", "--user", "stop", "vice.service"],
                  )
                  stop.assert_called_once_with()
                  wait.assert_called_once_with(timeout=0.25)

              def test_shutdown_without_systemd_still_stops_and_waits(self) -> None:
                  with mock.patch.object(
                      tray_app._app, "_systemd_unit_available", return_value=False
                  ), mock.patch.object(
                      tray_app.subprocess, "run"
                  ) as run, mock.patch.object(
                      tray_app._app, "_stop_daemon"
                  ) as stop, mock.patch.object(
                      tray_app._app, "_wait_for_daemon_exit", return_value=True
                  ) as wait:
                      tray_app._stop_daemon_completely(timeout=0.25)

                  run.assert_not_called()
                  stop.assert_called_once_with()
                  wait.assert_called_once_with(timeout=0.25)


          if __name__ == "__main__":
              unittest.main()
          '''
          if marker not in test_text:
              raise SystemExit("test insertion point not found")
          tests.write_text(test_text.replace(marker, addition, 1))
          PY

      - name: Validate
        run: |
          python -m py_compile vice/tray_app.py tests/test_tray_app.py
          python -m unittest tests.test_tray_app -v

      - name: Commit lifecycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vice/tray_app.py tests/test_tray_app.py
          git commit -m "Fix tray close and quit lifecycle"
          git push origin main
